<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerifCar · Dashboard Web</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#12141C}
#dash-frame{width:100%;height:100%;border:none;display:block}
</style>
</head>
<body>
<iframe id="dash-frame" src="dash-00-login.html" allowfullscreen></iframe>
<script>
const ROUTES = {
  'login':         'dash-00-login.html',
  'visao-geral':   'dash-01-visao-geral.html',
  'monitoramento': 'dash-02-monitoramento.html',
  'tatica':        'dash-03-tatica.html',
  'inteligencia':  'dash-04-inteligencia.html',
  'detalhe':       'dash-05-detalhe.html',
  'performance':   'dash-06-performance.html',
  'busca':         'dash-07-busca.html',
  'configuracoes': 'dash-08-configuracoes.html',
};
window.goTo = function(rota) {
  const src = ROUTES[rota];
  if (src) document.getElementById('dash-frame').src = src;
  else console.warn('VerifCar dash: rota desconhecida →', rota);
};
window.addEventListener('message', function(e) {
  if (e.data && e.data.goTo) window.goTo(e.data.goTo);
});
</script>
</body>
</html>
