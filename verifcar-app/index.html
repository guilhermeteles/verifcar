<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/logos/logo-color.svg">
<title>VerifCar · Inspeção Veicular Inteligente</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;-webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #12141C;
    overflow: hidden;
  }
  #app-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
<iframe id="app-frame" src="verifcar-01-login.html" allowfullscreen></iframe>

<script>
  // Mapa de rotas
  const ROUTES = {
    'login':    'verifcar-01-login.html',
    'home':     'verifcar-02-home.html',
    'camera':   'verifcar-03-camera-traseira.html',
    'ficha':    'verifcar-04-ficha-completa.html',
    'captura':  'verifcar-05-captura-assistida.html',
    'revisao':  'verifcar-06-revisao.html',
    'tour':     'verifcar-tour.html',
  };

  // Função chamada pelas telas filhas via parent.goTo('rota')
  window.goTo = function(rota) {
    const src = ROUTES[rota];
    if (src) {
      document.getElementById('app-frame').src = src;
    } else {
      console.warn('VerifCar: rota desconhecida →', rota);
    }
  };

  // Escuta mensagens postMessage (alternativa ao parent.goTo para iframes cross-origin)
  window.addEventListener('message', function(e) {
    if (e.data && e.data.goTo) {
      window.goTo(e.data.goTo);
    }
  });
</script>
</body>
</html>
