<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerifCar · Documentação Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}

:root{--pri-deep:#0C6B4E;--pri-deep2:#149B72;
  --pri:#23CB97;--pri-50:#0F221D;--pri-100:#16352C;
  --pri-400:#23CB97;--pri-600:#4FDCB0;--pri-800:#93EED3;
  --em:#23CB97;--em-50:#0F221D;--em-400:#35D9A4;
  --am:#F0A92B;--am-50:#2A1F0E;--am-400:#F0A92B;--am-800:#FFD48A;
  --co:#FF3B63;--co-50:#2B1119;--co-400:#FF3B63;--co-800:#FF95AC;
  --bg:#12141C;--sur:#1A1D28;--sur2:#20232F;--sur3:#2A2E3C;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.15);
  --text-h:#F3F5F9;--text-m:#8D94A6;--text-s:#666D80;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
  --font-m:'JetBrains Mono',monospace;
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  font-family:var(--font-b);
  color:var(--text-h);
  overflow:hidden;
}

/* ── TOPBAR ─────────────────────────────────────────────── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:200;
  background:rgba(8,11,24,0.94);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0;padding:0 20px;
}
.tb-logo{
  font-family:var(--font-d);font-size:15px;font-weight:800;
  color:var(--text-h);letter-spacing:2px;
}
.tb-sep{width:1px;height:16px;background:var(--border2);margin:0 14px}
.tb-tag{font-family:var(--font-m);font-size:9px;color:var(--text-s);letter-spacing:1px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-pill{
  font-family:var(--font-m);font-size:8px;font-weight:700;
  padding:3px 10px;border-radius:9999px;letter-spacing:.5px;
  border:1px solid var(--border2);color:var(--text-s);
  cursor:default;
}
.tb-pill.app{border-color:rgba(35,203,151,0.4);color:rgba(150,160,255,0.7);background:rgba(35,203,151,0.08)}
.tb-pill.dash{border-color:rgba(35,203,151,0.4);color:rgba(100,200,110,0.7);background:rgba(35,203,151,0.08)}
.tb-pill.ec{border-color:rgba(240,169,43,0.4);color:rgba(220,165,50,0.7);background:rgba(240,169,43,0.08)}

.rainbow-bar{
  position:fixed;top:0;left:0;right:0;height:3px;z-index:300;
  background:linear-gradient(90deg,var(--pri-800),var(--pri-400),var(--em-400),var(--pri-400),var(--pri-800));
  box-shadow:0 0 16px rgba(0,0,0,1.0);
}

/* ── CANVAS ─────────────────────────────────────────────── */
#canvas{
  position:fixed;top:52px;left:0;right:0;bottom:0;
  overflow:hidden;
  cursor:grab;
  background:var(--bg);
  background-image:
    radial-gradient(rgba(35,203,151,0.12) 1px, transparent 1px);
  background-size:28px 28px;
}
#canvas:active{cursor:grabbing}
#world{
  position:absolute;
  transform-origin:0 0;
  will-change:transform;
}

/* ── SECTION LABELS ─────────────────────────────────────── */
.section-label{
  position:absolute;
  font-family:var(--font-m);font-size:9px;font-weight:700;
  color:rgba(255,255,255,0.12);text-transform:uppercase;letter-spacing:2.5px;
  pointer-events:none;user-select:none;
}
.section-bg{
  position:absolute;border-radius:20px;
  pointer-events:none;
}

/* ── NODE CARD ──────────────────────────────────────────── */
.node{
  position:absolute;
  width:170px;
  cursor:pointer;
  user-select:none;
}
/* Dashboard nodes são mais largos */
.node.node-dash{
  width:240px;
}
.node-inner{
  border-radius:16px;
  overflow:hidden;
  border:1.5px solid var(--border);
  background:var(--sur);
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  transition:border-color .2s, box-shadow .2s, transform .2s;
}
.node:hover .node-inner{
  border-color:rgba(35,203,151,0.6);
  box-shadow:0 8px 40px rgba(0,0,0,1.0),0 0 0 1px rgba(0,0,0,0.55);
  transform:translateY(-3px);
}
.node.active .node-inner{
  border-color:var(--pri-400);
  box-shadow:0 12px 48px rgba(0,0,0,1.0),0 0 0 2px rgba(0,0,0,0.77);
}
.node-topbar{
  height:22px;display:flex;align-items:center;gap:5px;
  padding:0 9px;
  background:rgba(30,36,80,0.8);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nd-dot{width:5px;height:5px;border-radius:50%}
.nd-title{
  font-family:var(--font-m);font-size:7px;font-weight:700;
  color:rgba(255,255,255,0.3);margin-left:auto;letter-spacing:.8px;
}
/* preview mobile */
.node-preview{
  height:200px;overflow:hidden;position:relative;
}
.node-preview iframe{
  width:390px;height:780px;
  border:none;display:block;
  pointer-events:none;
  transform:scale(calc(170/390));
  transform-origin:top left;
}
/* preview notebook — 240×150px mostrando 1280×800 */
.node-preview.preview-dash{
  height:150px;
}
.node-preview.preview-dash iframe{
  width:1280px;height:800px;
  transform:scale(calc(240/1280));
  transform-origin:top left;
}
.node-label{
  padding:9px 10px 10px;
  background:linear-gradient(0deg,rgba(8,11,24,0.98),rgba(8,11,24,0.7) 70%,transparent);
  position:relative;
}
.node-num{
  font-family:var(--font-m);font-size:8px;font-weight:700;
  color:var(--text-s);letter-spacing:.8px;margin-bottom:3px;
}
.node-name{
  font-family:var(--font-d);font-size:11px;font-weight:800;
  color:var(--text-h);line-height:1.2;
}
.node-badge{
  display:inline-block;margin-top:5px;
  font-family:var(--font-m);font-size:7px;font-weight:700;
  padding:2px 8px;border-radius:9999px;letter-spacing:.4px;
}
.badge-app{background:rgba(35,203,151,0.15);color:rgba(150,160,255,0.8);border:1px solid rgba(35,203,151,0.3)}
.badge-dash{background:rgba(35,203,151,0.12);color:rgba(80,190,90,0.85);border:1px solid rgba(35,203,151,0.25)}
.badge-ec{background:rgba(240,169,43,0.1);color:rgba(220,165,50,0.85);border:1px dashed rgba(240,169,43,0.4)}
.badge-ret{background:rgba(255,59,99,0.1);color:rgba(255,100,80,0.85);border:1px solid rgba(255,59,99,0.25)}

/* ── SCREEN NAME TAG abaixo do card ─────────────────────── */
.node-slot-label{
  margin-top:8px;
  text-align:center;
}
.node-slot-num{
  font-family:var(--font-m);font-size:8px;
  color:var(--text-s);letter-spacing:.8px;
  display:block;margin-bottom:2px;
}
.node-slot-name{
  font-family:var(--font-d);font-size:11px;font-weight:700;
  color:var(--text-m);line-height:1.3;
}

/* ── PULSE NODE (sem iframe) ────────────────────────────── */
.node-noprev{
  height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;
  background:linear-gradient(135deg,rgba(35,203,151,0.06),rgba(35,203,151,0.12));
}
.node-icon{
  width:44px;height:44px;border-radius:14px;
  background:rgba(35,203,151,0.12);border:1px solid rgba(35,203,151,0.2);
  display:flex;align-items:center;justify-content:center;
}
.node-noprev-label{
  font-family:var(--font-m);font-size:8px;color:var(--text-s);letter-spacing:1px;
}

/* hover hint */
.node-hint{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;pointer-events:none;
  background:rgba(8,11,24,0.4);
  backdrop-filter:blur(2px);
  border-radius:14px;
}
.node:hover .node-hint{opacity:1}
.node-hint span{
  font-family:var(--font-m);font-size:8px;color:rgba(255,255,255,0.9);
  background:rgba(0,0,0,0.7);padding:5px 14px;
  border-radius:9999px;letter-spacing:.5px;
  border:1px solid rgba(255,255,255,0.1);
}

/* ── SVG ARROWS ─────────────────────────────────────────── */
#arrows-svg{
  position:absolute;top:0;left:0;
  pointer-events:none;overflow:visible;
}

/* ── DETAIL PANEL ───────────────────────────────────────── */
#panel{
  position:fixed;right:0;top:52px;bottom:0;
  width:340px;
  background:rgba(10,13,28,0.97);
  backdrop-filter:blur(20px);
  border-left:1px solid var(--border2);
  z-index:100;
  display:flex;flex-direction:column;
  transform:translateX(360px);
  transition:transform .3s cubic-bezier(.32,1.1,.5,1);
  overflow:hidden;
}
#panel.open{transform:translateX(0)}

.panel-header{
  padding:18px 20px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.panel-close{
  position:absolute;top:14px;right:16px;
  width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text-s);font-size:16px;font-family:var(--font-b);
  transition:all .15s;
}
.panel-close:hover{background:rgba(255,255,255,0.1);color:var(--text-h)}

.panel-num{
  font-family:var(--font-m);font-size:9px;font-weight:700;
  color:var(--pri-400);letter-spacing:1px;margin-bottom:4px;
}
.panel-title{
  font-family:var(--font-d);font-size:17px;font-weight:800;
  color:var(--text-h);margin-bottom:4px;
  padding-right:36px;
}
.panel-desc{
  font-size:11px;color:var(--text-m);line-height:1.6;
}

.panel-body{
  flex:1;overflow-y:auto;padding:16px 20px 20px;
}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(35,203,151,0.3);border-radius:2px}
.panel-body::-webkit-scrollbar-track{background:transparent}

/* Section dentro do panel */
.psec{margin-bottom:18px}
.psec-title{
  font-family:var(--font-m);font-size:8px;font-weight:700;
  color:var(--text-s);text-transform:uppercase;letter-spacing:1.5px;
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.psec-title::before{
  content:'';display:block;width:3px;height:10px;
  border-radius:2px;background:var(--pri-400);flex-shrink:0;
}
.psec-title.green::before{background:var(--em-400)}
.psec-title.amber::before{background:var(--am-400)}
.psec-title.red::before{background:var(--co-400)}

.pitem{
  display:flex;gap:9px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
  font-size:11px;color:var(--text-m);line-height:1.5;
  align-items:flex-start;
}
.pitem:last-child{border-bottom:none}
.pitem-dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(35,203,151,0.5);flex-shrink:0;margin-top:5px;
}
.pitem-dot.green{background:rgba(35,203,151,0.7)}
.pitem-dot.amber{background:rgba(240,169,43,0.7)}
.pitem-dot.red{background:rgba(255,59,99,0.7)}

.pcode{
  font-family:var(--font-m);font-size:9px;
  background:rgba(35,203,151,0.08);
  border:1px solid rgba(35,203,151,0.15);
  border-radius:6px;padding:8px 10px;
  color:rgba(160,170,255,0.8);
  line-height:1.7;
  margin-top:8px;
  white-space:pre;
  overflow-x:auto;
}
.pcode::-webkit-scrollbar{height:3px}
.pcode::-webkit-scrollbar-thumb{background:rgba(35,203,151,0.3);border-radius:2px}

.ptag{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--font-m);font-size:8px;font-weight:700;
  padding:2px 8px;border-radius:9999px;
  margin:2px 2px 2px 0;
}
.ptag.blue{background:rgba(35,203,151,0.15);color:rgba(150,160,255,0.9);border:1px solid rgba(35,203,151,0.25)}
.ptag.green{background:rgba(35,203,151,0.12);color:rgba(80,190,90,0.9);border:1px solid rgba(35,203,151,0.2)}
.ptag.amber{background:rgba(240,169,43,0.12);color:rgba(220,165,50,0.9);border:1px solid rgba(240,169,43,0.2)}
.ptag.red{background:rgba(255,59,99,0.1);color:rgba(255,100,80,0.9);border:1px solid rgba(255,59,99,0.2)}

.panel-preview-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:10px;border-radius:9999px;
  background:linear-gradient(135deg,var(--pri-deep),var(--pri-deep2));
  border:none;cursor:pointer;
  font-family:var(--font-b);font-size:12px;font-weight:600;color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,0.88);
  margin-top:4px;margin-bottom:12px;
  transition:opacity .15s;
}
.panel-preview-btn:hover{opacity:0.88}

/* ── FULLSCREEN OVERLAY ─────────────────────────────────── */
#fsOverlay{
  position:fixed;inset:0;z-index:400;
  background:rgba(4,5,14,0.92);
  backdrop-filter:blur(20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
#fsOverlay.open{opacity:1;pointer-events:all}
#fsPhone{
  width:375px;height:750px;border-radius:36px;overflow:hidden;
  border:2px solid rgba(35,203,151,0.5);
  box-shadow:0 32px 80px rgba(0,0,0,0.85);
  transform:scale(0.88) translateY(20px);
  transition:transform .3s cubic-bezier(.32,1.1,.5,1);
}
#fsOverlay.open #fsPhone{transform:scale(1) translateY(0)}
#fsPhone iframe{width:100%;height:100%;border:none;display:block}
#fsDashFrame{
  width:calc(100vw - 80px);
  max-width:1200px;
  height:calc((100vw - 80px) * 0.625);
  max-height:750px;
  border-radius:12px;overflow:hidden;
  border:1.5px solid rgba(35,203,151,0.4);
  box-shadow:0 24px 60px rgba(0,0,0,0.8);
  transform:scale(0.88) translateY(20px);
  transition:transform .3s cubic-bezier(.32,1.1,.5,1);
  display:none;
}
#fsOverlay.open #fsDashFrame{transform:scale(1) translateY(0)}
#fsDashFrame iframe{width:100%;height:100%;border:none;display:block}
#fsClose{
  font-family:var(--font-m);font-size:10px;color:var(--text-m);
  background:var(--sur);border:1px solid var(--border2);
  padding:7px 20px;border-radius:9999px;cursor:pointer;letter-spacing:.5px;
  transition:color .15s;
}
#fsClose:hover{color:var(--text-h)}

/* ── CONTROLS ───────────────────────────────────────────── */
.controls{
  position:fixed;bottom:20px;right:20px;z-index:150;
  display:flex;gap:6px;
}
.ctrl{
  width:34px;height:34px;border-radius:10px;
  background:rgba(15,20,40,0.9);
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-m);font-size:15px;
  transition:all .15s;backdrop-filter:blur(8px);
}
.ctrl:hover{background:var(--sur2);color:var(--text-h)}

/* ── LEGEND ─────────────────────────────────────────────── */
.legend{
  position:fixed;bottom:20px;left:20px;z-index:150;
  background:rgba(10,13,28,0.92);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;
  min-width:160px;
}
.leg-title{
  font-family:var(--font-m);font-size:8px;font-weight:700;
  color:var(--text-s);text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:9px;
}
.leg-row{
  display:flex;align-items:center;gap:8px;
  font-size:10px;color:var(--text-m);padding:2px 0;
  font-family:var(--font-b);
}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg-line-sample{
  width:26px;height:2px;border-radius:1px;flex-shrink:0;
}

/* ── TOOLTIP (arrow label) ──────────────────────────────── */
.arrow-label-bg{fill:var(--bg)}
.arrow-label-text{
  font-family:'JetBrains Mono',monospace;
  font-size:8px;fill:rgba(141,148,166,0.55);
  letter-spacing:.3px;
}

/* shimmer on load */
@keyframes shimmer{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:translateY(0)}
}
.node{animation:shimmer .4s ease both}
</style>
</head>
<body>

<div class="rainbow-bar"></div>

<div class="topbar">
  <span class="tb-logo">VerifCar</span>
  <div class="tb-sep"></div>
  <span class="tb-tag">DOCUMENTAÇÃO TÉCNICA · FLUXO COMPLETO</span>
  <div class="tb-right">
    <span class="tb-pill app">APP MOBILE</span>
    <span class="tb-pill dash">DASHBOARD WEB</span>
    <span class="tb-pill ec">EDGE CASES</span>
    <div class="tb-sep"></div>
    <span style="font-family:var(--font-m);font-size:9px;color:var(--text-s)">18 telas · 2 sistemas</span>
  </div>
</div>

<div id="canvas">
  <div id="world">
    <svg id="arrows-svg"></svg>
  </div>
</div>

<div class="legend">
  <div class="leg-title">Legenda</div>
  <div class="leg-row"><span class="leg-dot" style="background:rgba(35,203,151,0.9)"></span>App Mobile</div>
  <div class="leg-row"><span class="leg-dot" style="background:rgba(35,203,151,0.9)"></span>Dashboard Web</div>
  <div class="leg-row"><span class="leg-dot" style="background:rgba(240,169,43,0.9)"></span>Edge Case</div>
  <div style="margin-top:8px;border-top:1px solid rgba(255,255,255,0.05);padding-top:8px">
  <div class="leg-row">
    <div class="leg-line-sample" style="background:rgba(35,203,151,0.7)"></div>
    Fluxo principal
  </div>
  <div class="leg-row">
    <div class="leg-line-sample" style="background:rgba(35,203,151,0.4);background-image:repeating-linear-gradient(90deg,rgba(35,203,151,.5) 0,rgba(35,203,151,.5) 4px,transparent 4px,transparent 8px)"></div>
    Alternativo
  </div>
  <div class="leg-row">
    <div class="leg-line-sample" style="background:rgba(240,169,43,0.6);background-image:repeating-linear-gradient(90deg,rgba(240,169,43,.6) 0,rgba(240,169,43,.6) 3px,transparent 3px,transparent 7px)"></div>
    Edge case
  </div>
  </div>
  <div style="margin-top:8px;border-top:1px solid rgba(255,255,255,0.05);padding-top:8px">
    <div class="leg-row" style="font-size:9px;color:var(--text-s)">· arraste para navegar</div>
    <div class="leg-row" style="font-size:9px;color:var(--text-s)">· scroll para zoom</div>
    <div class="leg-row" style="font-size:9px;color:var(--text-s)">· clique para detalhes</div>
  </div>
</div>

<div class="controls">
  <div class="ctrl" id="btnZoomIn" title="Zoom in">+</div>
  <div class="ctrl" id="btnZoomOut" title="Zoom out">−</div>
  <div class="ctrl" id="btnReset" title="Resetar visão" style="font-size:11px">⌂</div>
</div>

<!-- Detail Panel -->
<div id="panel">
  <div class="panel-header">
    <div class="panel-close" id="panelClose">✕</div>
    <div class="panel-num" id="pNum"></div>
    <div class="panel-title" id="pTitle"></div>
    <div class="panel-desc" id="pDesc"></div>
  </div>
  <div class="panel-body" id="pBody"></div>
</div>

<!-- Fullscreen overlay -->
<div id="fsOverlay">
  <div id="fsPhone"><iframe id="fsIframe" src="" title="preview"></iframe></div>
  <div id="fsDashWrap" style="display:none;flex-direction:column;align-items:center;gap:0">
    <!-- bezel top do notebook -->
    <div style="width:calc(100vw - 80px);max-width:1200px;height:28px;background:linear-gradient(180deg,#1a1c28,#141620);border-radius:10px 10px 0 0;border:1.5px solid rgba(35,203,151,0.35);border-bottom:none;display:flex;align-items:center;justify-content:center">

const NODE_W_APP = 170;
const NODE_W_DASH = 240;
const NODE_H_APP = 310;  // approx (topbar 22 + preview 200 + label ~88)
const NODE_H_DASH = 245; // topbar 22 + preview 150 + label ~73

// helper: node dimensions
function nodeDims(n){
  if(n.group==='dash') return {w:NODE_W_DASH, h:NODE_H_DASH};
  return {w:NODE_W_APP, h:NODE_H_APP};
}

let isDragging=false, dragSt={x:0,y:0};

function applyTransform(){
  document.getElementById('world').style.transform =

}

function buildNodes(){
  const world = document.getElementById('world');
  NODES.forEach((n,i) => {
    const el = document.createElement('div');
    const isDash = n.group === 'dash';
    el.className = 'node' + (isDash ? ' node-dash' : '');
    el.id = 'node-'+n.id;
    el.style.left = n.x+'px';
    el.style.top  = n.y+'px';
    el.style.animationDelay = (i*0.04)+'s';

    const previewClass = isDash ? 'node-preview preview-dash' : 'node-preview';

    el.innerHTML = `
      <div class="node-inner">
        <div class="node-topbar">
          <div class="nd-dot" style="background:#ff5f57"></div>
          <div class="nd-dot" style="background:#ffbd2e"></div>
          <div class="nd-dot" style="background:#28c840"></div>
          <div class="nd-title">${n.num}</div>
        </div>
        <div class="${previewClass}">
          <iframe src="${n.src}" loading="lazy" scrolling="no" title="${n.name}"></iframe>
          <div class="node-hint"><span>VER DETALHES</span></div>
        </div>
        <div class="node-label">
          <div class="node-num">${n.num}</div>
          <div class="node-name">${n.name}</div>
          <div class="node-badge ${n.badgeClass}">${n.badge}</div>

      <div class="node-slot-label">
        <span class="node-slot-num">${n.num}</span>

    el.addEventListener('click', () => openPanel(n));
    world.appendChild(el);

}

function getNodeCenter(id){
  const n = NODES.find(x=>x.id===id);
  if(!n) return null;
  const {w,h} = nodeDims(n);
  return { cx: n.x + w/2, cy: n.y + h/2,
           t:  {x: n.x + w/2, y: n.y},
           b:  {x: n.x + w/2, y: n.y + h},
           l:  {x: n.x,       y: n.y + h/2},
           r:  {x: n.x + w,   y: n.y + h/2} };
}

function buildArrows(){
  const svg = document.getElementById('arrows-svg');
  svg.setAttribute('width','2400');
  svg.setAttribute('height','2200');

  // defs
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  const markers = [
    {id:'m-main', col:'rgba(35,203,151,0.8)'},
    {id:'m-alt',  col:'rgba(35,203,151,0.5)'},
    {id:'m-ret',  col:'rgba(35,203,151,0.7)'},
    {id:'m-ec',   col:'rgba(240,169,43,0.7)'},
    {id:'m-cross',col:'rgba(200,200,220,0.4)'},
  ];
  markers.forEach(m => {
    const mk = document.createElementNS('http://www.w3.org/2000/svg','marker');
    mk.setAttribute('id',m.id);mk.setAttribute('markerWidth','8');mk.setAttribute('markerHeight','8');
    mk.setAttribute('refX','7');mk.setAttribute('refY','4');mk.setAttribute('orient','auto');
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points','0 0,8 4,0 8');poly.setAttribute('fill',m.col);
    mk.appendChild(poly);defs.appendChild(mk);
  });
  svg.appendChild(defs);

  ARROWS.forEach(([fId,tId,type,label]) => {
    const f = getNodeCenter(fId), t = getNodeCenter(tId);
    if(!f||!t) return;

    const colMap = {
      main:'rgba(35,203,151,0.65)',
      alt: 'rgba(35,203,151,0.35)',
      ret: 'rgba(35,203,151,0.55)',
      ec:  'rgba(240,169,43,0.55)',
      cross:'rgba(200,200,220,0.2)',
    };
    const dashMap = {
      main:'none',alt:'5,3',ret:'3,4',ec:'4,3',cross:'6,4'
    };

    const col = colMap[type]||colMap.main;
    const dash = dashMap[type]||'none';

    // choose anchor points based on relative position
    let p1, p2;
    const sameRow = Math.abs(f.cy - t.cy) < 160;

    if(type==='cross'){
      // app-revisao (y~100) → dash-visao (y~1020): sempre bottom→top
      p1 = f.b; p2 = t.t;
    } else if(sameRow){
      if(f.cx < t.cx){ p1=f.r; p2=t.l; }
      else { p1=f.l; p2=t.r; }
    } else {
      // entre linhas do dashboard ou diagonal
      if(f.cy < t.cy){ p1=f.b; p2=t.t; }
      else { p1=f.t; p2=t.b; }
    }

    const dx = p2.x-p1.x, dy = p2.y-p1.y;
    let d;
    if(Math.abs(dx) > Math.abs(dy)){
      const cx1=p1.x+Math.abs(dx)*0.4, cx2=p2.x-Math.abs(dx)*0.4;
      d=`M${p1.x},${p1.y} C${cx1},${p1.y} ${cx2},${p2.y} ${p2.x},${p2.y}`;
    } else {
      const cy1=p1.y+Math.abs(dy)*0.4, cy2=p2.y-Math.abs(dy)*0.4;
      d=`M${p1.x},${p1.y} C${p1.x},${cy1} ${p2.x},${cy2} ${p2.x},${p2.y}`;
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke',col);
    path.setAttribute('stroke-width', type==='cross'?'1':'1.5');
    path.setAttribute('stroke-opacity','1');
    if(dash!=='none') path.setAttribute('stroke-dasharray',dash);
    path.setAttribute('marker-end','url(#m-'+type+')');
    svg.appendChild(path);

    if(label){
      const midX = (p1.x+p2.x)/2, midY = (p1.y+p2.y)/2;
      const tw = label.length*5+14;
      const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
      bg.setAttribute('x',midX-tw/2); bg.setAttribute('y',midY-9);
      bg.setAttribute('width',tw); bg.setAttribute('height',13);
      bg.setAttribute('rx','4'); bg.setAttribute('fill',col.replace('0.','0.0'));
      bg.setAttribute('fill','rgba(8,11,24,0.9)');
      svg.appendChild(bg);

      const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',midX); txt.setAttribute('y',midY+1);
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('font-family',"'JetBrains Mono',monospace");
      txt.setAttribute('font-size','8');
      txt.setAttribute('fill',col);
      txt.textContent = label;
      svg.appendChild(txt);
    }
  });
}

function openPanel(n){
  // deactivate previous
  document.querySelectorAll('.node').forEach(el=>el.classList.remove('active'));
  document.getElementById('node-'+n.id).classList.add('active');
  activeNode = n;

  // populate header
  document.getElementById('pNum').textContent = n.num;
  document.getElementById('pTitle').textContent = n.name;
  document.getElementById('pDesc').textContent = n.desc;

  // build body
  const body = document.getElementById('pBody');
  const isDash = n.group === 'dash';
  const btnLabel = isDash ? 'Abrir no navegador →' : 'Ver tela em tamanho real →';

  let html = `<button class="panel-preview-btn" onclick="openFS('${n.src}','${n.group}')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    ${btnLabel}
  </button>`;

  n.sections.forEach(s => {
    const colorClass = s.color || 'blue';
    html += `<div class="psec">
      <div class="psec-title ${colorClass}">${s.title}</div>`;
    s.items.forEach(item => {
      html += `<div class="pitem">
        <div class="pitem-dot ${colorClass}"></div>
        <div>${item}</div>
      </div>`;
    });
    if(s.code){
      html += `<div class="pcode">${escapeHtml(s.code)}</div>`;
    }
    if(s.tags){
      html += '<div style="margin-top:6px">';
      s.tags.forEach(t => {
        html += `<span class="ptag ${t.c}">${t.l}</span>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  body.innerHTML = html;

  document.getElementById('panel').classList.add('open');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.node').forEach(el=>el.classList.remove('active'));
  activeNode = null;
}

function openFS(src, group){
  const isPhone = group !== 'dash';
  const phone    = document.getElementById('fsPhone');
  const dashWrap = document.getElementById('fsDashWrap');
  const iframe1  = document.getElementById('fsIframe');
  const iframe2  = document.getElementById('fsDashIframe');

  if(isPhone){
    phone.style.display = 'block';
    dashWrap.style.display = 'none';
    iframe1.src = src; iframe2.src = '';
  } else {
    phone.style.display = 'none';
    dashWrap.style.display = 'flex';
    iframe2.src = src; iframe1.src = '';
  }
  document.getElementById('fsOverlay').classList.add('open');
}

window.closeFS = function(){
  document.getElementById('fsOverlay').classList.remove('open');
  setTimeout(()=>{
    document.getElementById('fsIframe').src='';
    document.getElementById('fsDashIframe').src='';
  },300);
};

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function bindInteractions(){
  document.getElementById('panelClose').addEventListener('click', closePanel);
  document.getElementById('fsOverlay').addEventListener('click', e=>{
    if(e.target.id==='fsOverlay') closeFS();
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(document.getElementById('fsOverlay').classList.contains('open')) closeFS();
      else closePanel();
    }
  });

  const canvas = document.getElementById('canvas');
  canvas.addEventListener('mousedown', e=>{
    if(e.target.closest('.node')) return;
    isDragging=true;
    dragSt={x:e.clientX-worldTx, y:e.clientY-worldTy};
  });
  window.addEventListener('mousemove', e=>{
    if(!isDragging) return;
    worldTx=e.clientX-dragSt.x;
    worldTy=e.clientY-dragSt.y;
    applyTransform();
  });
  window.addEventListener('mouseup', ()=>isDragging=false);
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.1 : 0.91;
    worldScale = Math.min(2, Math.max(0.2, worldScale*f));
    applyTransform();
  },{passive:false});

  // touch pan
  let t0=null;
  canvas.addEventListener('touchstart', e=>{
    if(e.touches.length===1){ t0={x:e.touches[0].clientX-worldTx, y:e.touches[0].clientY-worldTy}; }
  },{passive:true});
  canvas.addEventListener('touchmove', e=>{
    if(e.touches.length===1 && t0){
      worldTx=e.touches[0].clientX-t0.x;
      worldTy=e.touches[0].clientY-t0.y;
      applyTransform();
    }
  },{passive:true});
  canvas.addEventListener('touchend', ()=>t0=null,{passive:true});

  document.getElementById('btnZoomIn').addEventListener('click',()=>{
    worldScale=Math.min(2,worldScale*1.15);applyTransform();
  });
  document.getElementById('btnZoomOut').addEventListener('click',()=>{
    worldScale=Math.max(0.2,worldScale*0.87);applyTransform();
  });
  document.getElementById('btnReset').addEventListener('click',()=>{
    worldTx=80;worldTy=60;worldScale=0.72;applyTransform();
  });
}
